name: Android TV APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinematv-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate device QA harness without an emulator
        run: |
          bash -n scripts/run-device-qa.sh
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 backdrop/scripts/verify-production-source.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts/glass-production -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/glass-performance -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore pinned offline Noto fonts
        uses: actions/cache@v4
        with:
          path: .cache/cinematv-noto-fonts
          # Durable downloads, not Gradle task outputs (which stale-output cleanup may delete).
          # Font bytes are platform-independent; APK and device jobs share this exact key.
          key: noto-fonts-v2-${{ hashFiles('scripts/fonts/noto-fonts.lock.json') }}
      - name: Build, lint and test
        run: |
          bash scripts/generate-test-media.sh
          gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :backdrop:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:compileGlassBenchmarkKotlin :backdrop:lintDebug :app:lintDebug
          npm --prefix backend/tv-bff test
      - name: Verify exact Noto font bytes before further gates
        run: python3 scripts/fonts/verify-noto-fonts.py
      - name: Require executed Android JUnit tests
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for module in ('app', 'backdrop'):
              paths = list(Path(module, 'build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
              cases = [case for path in paths for case in ET.parse(path).getroot().iter('testcase')]
              assert cases, f'{module}: absent executed tests (NO-SOURCE)'
              assert all(case.find(tag) is None for case in cases for tag in ('failure', 'error', 'skipped'))
          PYTEST
      - name: Validate APK archive and signature
        shell: bash
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Record immutable build provenance
        run: python3 scripts/preview-release.py receipt --device apk --output qa/promotion-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build-receipt
          path: qa/promotion-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/schemas/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            backdrop/build/test-results/
            backdrop/build/reports/lint-results-debug.*
          if-no-files-found: warn
  ui-qa:
    needs: apk
    if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[preview-release]') || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[ui-qa]') || contains(github.event.pull_request.title, '[ui-tv4k]'))) || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc')))
    uses: ./.github/workflows/tv-smoke.yml
    with:
      # A diagnostic PR can test 4K alone. Main/tag release candidates still use all.
      target: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[ui-tv4k]') && 'tv4k' || 'all' }}
  preview:
    needs: [apk, ui-qa]
    if: (!contains(github.event.head_commit.message, '[promote-preview')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[preview-release]')) || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CinemaTV-debug-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-evidence-*
          path: qa
      - name: Publish exact tested commit and QA evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c 'import re,pathlib; print(re.search(r"versionName = \"([^\"]+)\"",pathlib.Path("app/build.gradle.kts").read_text()).group(1))')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(preview|rc)(\.[0-9]+)?$ ]]
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          mv dist/app-debug.apk "dist/CinemaTV-$TAG.apk"
          cp qa/ui-evidence-tv1080/qa/ui-evidence/01-home.png "dist/CinemaTV-$TAG-home.png"
          (cd qa && zip -qr "../dist/CinemaTV-$TAG-ui-evidence.zip" .)
          (cd dist && sha256sum *.apk *.png *.zip > SHA256SUMS.txt)
          cp "docs/releases/$TAG.md" /tmp/cinematv-release-notes.md
          printf '\nTested commit: `%s`\n\n[Build and full UI QA](%s/%s/actions/runs/%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/cinematv-release-notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "CinemaTV $TAG · Personal Library" --notes-file /tmp/cinematv-release-notes.md

  promote-preview:
    needs: apk
    if: github.repository == 'blackkcold/CinemaTV' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[promote-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify full same-tree evidence and publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/preview-release.py promote --output promoted-dist --publish
