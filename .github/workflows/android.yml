name: Android TV APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK command line tools missing"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and unit test
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          npm --prefix backend/tv-bff test
      - name: Require executed Android JUnit tests
        run: |
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -quit | grep -q . || { echo "Android tests absent (NO-SOURCE)"; exit 1; }
      - name: Validate APK archive and signature
        shell: bash
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish prerelease on version tags
        if: startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/*.apk --prerelease --generate-notes --title "CinemaTV ${GITHUB_REF_NAME} (test APK)"
      - name: Publish verified preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[preview-release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0-preview app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CinemaTV v0.1.0 Preview (debug-signed APK)" \
            --notes "Preview build for self-hosted LibreTV testing. CI-compiled, unit-tested, APK signature-verified. Requires server setup and TV device testing. Not a stable or production-signed release."
