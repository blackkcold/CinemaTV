name: Android TV APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK command line tools missing"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and unit test
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish prerelease on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/*.apk --prerelease --generate-notes --title "CinemaTV ${GITHUB_REF_NAME} (test APK)"
