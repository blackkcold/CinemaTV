name: Acceptance / immutable APK configurations
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: .cache/cinematv-noto-fonts
          key: noto-fonts-v2-${{ hashFiles('scripts/fonts/noto-fonts.lock.json') }}
      - name: Install compilation SDK before any device allocation
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, lint and verify both configurations and unsigned release
        run: bash scripts/acceptance/build.sh "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-preview-debug-apks
          path: ${{ runner.temp }}/acceptance-preview-debug-apks/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-dev-debug-apks
          path: ${{ runner.temp }}/acceptance-dev-debug-apks/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-build-identities
          path: ${{ runner.temp }}/acceptance-build-identities/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-UNSIGNED-dev-NOT-FOR-INSTALLATION
          path: ${{ runner.temp }}/acceptance-unsigned-dev/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-build-reports
          path: |
            ${{ runner.temp }}/acceptance-build-reports/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
