name: Diagnostics synthetic safety
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/dev/cinematv/diagnostics/**'
      - 'app/src/main/java/dev/cinematv/ui/diagnostics/**'
      - 'app/src/main/java/dev/cinematv/data/doubanchart/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/xml/diagnostic_file_paths.xml'
      - 'app/src/androidTest/java/dev/cinematv/DiagnosticsUiTest.kt'
      - '.github/workflows/diagnostics-safety.yml'
      - 'app/build.gradle.kts'
permissions:
  contents: read
concurrency:
  group: diagnostics-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone33
            api: 33
            target: default
            size: 1080x2400
            density: 420
            classes: 'dev.cinematv.DiagnosticsUiTest,dev.cinematv.DiagnosticsLayoutTest'
          - name: compat26
            api: 26
            target: google_apis
            size: 1920x1080
            density: 320
            classes: 'dev.cinematv.DiagnosticsUiTest,dev.cinematv.TvDiagnosticsUiTest,dev.cinematv.TvDiagnosticsConfirmFocusTest,dev.cinematv.DiagnosticsLayoutTest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: .cache/cinematv-noto-fonts
          key: noto-fonts-v2-${{ hashFiles('scripts/fonts/noto-fonts.lock.json') }}
      - name: Build synthetic-only acceptance
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          bash scripts/generate-test-media.sh
          gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-build: '15004761'
          disable-animations: false
          emulator-options: '-no-window -no-audio -gpu lavapipe -feature -Vulkan -no-snapshot -no-boot-anim -memory 2048'
          script: bash scripts/run-device-qa.sh '${{ matrix.size }}' '${{ matrix.density }}' '${{ matrix.classes }}'
      - name: Require all synthetic diagnostics cases executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re
          cases = [c for p in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')]
          sources = ['app/src/androidTest/java/dev/cinematv/DiagnosticsUiTest.kt']
          expected = {name for path in sources for name in re.findall(r'@Test\s+fun\s+(\w+)', Path(path).read_text())}
          # The TV-only cases live in Tv* classes and run on the landscape compat26
          # lane; the portrait phone lane executes the same file's portable cases.
          # The test run itself (not this audit) enforces the TV cases.
          tv_only = {'remoteTogglesLoggingAndReturnsFocusToTheEntry',
                     'clearingLogsDefaultsFocusToCancelAndKeepsTheLogs'}
          expected -= tv_only
          assert expected, 'Missing required diagnostics coverage'
          actual = [c for c in cases if c.get('name') in expected]
          assert {c.get('name') for c in actual} == expected, 'Missing device test'
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in actual), 'Device test did not pass'
          PY
      - name: State synthetic boundary
        if: always()
        run: echo 'Synthetic-only native tests. No account, cookie, QR login or personal list was used, and no network request is asserted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-synthetic-${{ matrix.name }}
          path: |
            qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
