name: Production release safety notice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-signing-required:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete GitHub signing path
        run: |
          echo 'Production signing is performed only on an approved non-GitHub machine.'
          echo 'Do not configure keystores, signing passwords or 1Password credentials in GitHub Secrets.'
          echo 'Use docs/UPDATE_CHANNELS.md and collect exact signed-APK acceptance before publication.'
          exit 1
