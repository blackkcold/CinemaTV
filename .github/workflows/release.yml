name: CinemaTV certified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable SemVer tag, for example v1.0.0
        required: true
        type: string
      qa_certification:
        description: Type TV_HARDWARE_QA_PASSED after recording evidence
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check release approval and evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CERTIFICATION: ${{ inputs.qa_certification }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [ "$CERTIFICATION" = "TV_HARDWARE_QA_PASSED" ] || exit 1
          if grep -Eq 'TBD|NOT ZERO' docs/RELEASE_CHECKLIST.md; then
            echo "Hardware testing evidence is incomplete"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare private signing keystore
        env:
          KEY_B64: ${{ secrets.CINEMATV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CINEMATV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINEMATV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CINEMATV_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cinematv-release.jks"
      - name: Build and verify signed APK
        env:
          CINEMATV_KEYSTORE_PATH: ${{ runner.temp }}/cinematv-release.jks
          CINEMATV_KEYSTORE_PASSWORD: ${{ secrets.CINEMATV_KEYSTORE_PASSWORD }}
          CINEMATV_KEY_ALIAS: ${{ secrets.CINEMATV_KEY_ALIAS }}
          CINEMATV_KEY_PASSWORD: ${{ secrets.CINEMATV_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          npm --prefix backend/tv-bff test
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -quit | grep -q .
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release.sha256
      - name: Publish production APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk app-release.sha256 --target "$GITHUB_SHA" --generate-notes --title "CinemaTV $RELEASE_TAG" --notes "Hardware-certified and production-signed Android TV release. See docs/RELEASE_CHECKLIST.md for supporting evidence."
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/cinematv-release.jks"
