name: CinemaTV device UI QA
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'
permissions:
  contents: read
jobs:
  instrumented:
    name: UI / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            api: 30
            size: 1080x1920
            density: 420
            classes: dev.cinematv.MobileNavigationSmokeTest,dev.cinematv.TvLaunchSmokeTest,dev.cinematv.MobilePlaybackSmokeTest
          - name: tv1080
            api: 33
            size: 1920x1080
            density: 320
            classes: dev.cinematv.TvUiRegressionTest
          - name: tv4k
            api: 33
            size: 3840x2160
            density: 640
            classes: dev.cinematv.TvUiRegressionTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install compile SDK and original media fixture
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          bash scripts/generate-test-media.sh
          python -m pip install 'Pillow==11.3.0'
      - name: Compile instrumentation before allocating emulator memory
        run: |
          free -m
          gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
          free -m
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Android's archived stable build; newer 37.2.13 runners lost the
          # emulator connection during screenshot readback in this suite.
          emulator-build: '15004761'
          disable-animations: false
          emulator-options: '-no-window -no-audio -gpu swiftshader -feature -Vulkan -no-snapshot -no-boot-anim -memory 2048'
          script: bash scripts/run-device-qa.sh '${{ matrix.size }}' '${{ matrix.density }}' '${{ matrix.classes }}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ matrix.name }}
          path: |
            qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
