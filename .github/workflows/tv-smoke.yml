name: CinemaTV device UI QA
on:
  workflow_call:
    inputs:
      target:
        description: Device target; full coverage is required before release
        type: string
        default: all
  workflow_dispatch:
    inputs:
      target:
        description: Select one device for diagnosis, or all for acceptance
        type: choice
        default: all
        options: [all, phone, tv1080, tv4k, tvNative, tv29, tv31, tv36, compat26]
  schedule:
    - cron: '40 3 * * 1'
permissions:
  contents: read
concurrency:
  # A reusable workflow must never share its caller's concurrency group.
  group: cinematv-device-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate device QA harness without an emulator
        run: |
          bash -n scripts/run-device-qa.sh
          python3 -m unittest discover -s scripts/tests -v
      - id: select
        env:
          QA_TARGET: ${{ inputs.target || 'all' }}
        run: |
          MATRIX=$(python3 scripts/qa-device-matrix.py "$QA_TARGET")
          printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"
  instrumented:
    name: UI / ${{ matrix.name }}
    needs: select-devices
    # Keep the emulator off the moving ubuntu-latest OS release; Ubuntu 26.04
    # images changed between passing and failing 4K runs (cause unconfirmed).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-devices.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore pinned offline Noto fonts
        uses: actions/cache@v4
        with:
          path: .cache/cinematv-noto-fonts
          # Durable downloads, not Gradle task outputs (which stale-output cleanup may delete).
          # Font bytes are platform-independent; APK and device jobs share this exact key.
          key: noto-fonts-v2-${{ hashFiles('scripts/fonts/noto-fonts.lock.json') }}
      - name: Install compile SDK and validate original media fixture
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          # Validate committed synthetic bytes offline; no per-device FFmpeg install.
          bash scripts/generate-test-media.sh
          python -m pip install 'Pillow==11.3.0'
      - name: Compile instrumentation before allocating emulator memory
        timeout-minutes: 13
        run: |
          mkdir -p qa
          free -m
          START=$SECONDS
          set +e
          timeout --signal=TERM --kill-after=30s 12m gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
          STATUS=$?
          printf 'assemble\t%s\t%s\n' "$STATUS" "$((SECONDS - START))" > qa/stages.tsv
          free -m
          exit "$STATUS"
      - name: Verify exact Noto font bytes before further gates
        run: python3 scripts/fonts/verify-noto-fonts.py
      - name: Prepare checksum-pinned official LibreTV and Node for phone and TV
        if: matrix.name == 'phone' || matrix.name == 'tv1080'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-libretv-android"
          cd "$RUNNER_TEMP/official-libretv-android"
          CURL=(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 90 --max-filesize 67108864)
          "${CURL[@]}" 'https://github.com/LibreSpark/LibreTV/releases/download/v2.21.1/libretv-2.21.1-standalone.tar.gz' -o libretv-2.21.1-standalone.tar.gz
          "${CURL[@]}" 'https://github.com/LibreSpark/LibreTV/releases/download/v2.21.1/SHA256SUMS' -o SHA256SUMS
          "${CURL[@]}" 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz' -o node-v22.23.4-linux-x64.tar.xz
          "${CURL[@]}" 'https://nodejs.org/dist/v22.23.4/SHASUMS256.txt' -o SHASUMS256.txt
          cd "$GITHUB_WORKSPACE"
          python3 scripts/libretv-contracts/prepare_official.py --directory "$RUNNER_TEMP/official-libretv-android" --report qa/official-artifact-verification.json
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        # 4K's bounded functional suite needs renderer variance plus setup/export.
        timeout-minutes: ${{ (matrix.name == 'tv4k' || matrix.name == 'tvNative') && 30 || 25 }}
        with:
          api-level: ${{ matrix.api }}
          # TV hosts use AOSP: prior Google-image evidence is a different
          # environment and cannot substitute for this matrix's acceptance.
          target: ${{ matrix.target }}
          arch: ${{ matrix.name == 'tvNative' && 'x86' || 'x86_64' }}
          profile: ${{ matrix.name == 'tvNative' && 'tv_1080p' || 'pixel_2' }}
          # Android's archived stable build; newer 37.2.13 runners lost the
          # emulator connection during screenshot readback in this suite.
          emulator-build: '15004761'
          disable-animations: false
          # Lavapipe passed the isolated API 33 public phone run (41859160272);
          # this motivates the renderer choice, but full matrix acceptance is pending.
          # API26 SurfaceFlinger checks the physical framebuffer width, not only
          # wm size. Match the native-capture lane's landscape skin; keep actual
          # compositor readback and every pixel/geometry assertion unchanged.
          emulator-options: "-no-window -no-audio -gpu lavapipe -feature -Vulkan -no-snapshot -no-boot-anim -memory 2048 ${{ matrix.api == 26 && '-skin 1920x1080' || '' }}"
          # The action executes each script line independently via sh -c.
          script: bash scripts/run-device-qa-target.sh '${{ matrix.name }}' '${{ matrix.size }}' '${{ matrix.density }}' '${{ matrix.classes }}'

      - name: Record successful device provenance for preview promotion
        run: python3 scripts/preview-release.py receipt --device '${{ matrix.name }}' --classes '${{ matrix.classes }}' --output qa/promotion-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ matrix.name }}
          path: |
            qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
