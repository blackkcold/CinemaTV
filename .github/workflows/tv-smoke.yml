name: CinemaTV device UI QA
on:
  workflow_call:
    inputs:
      target:
        description: Device target; full coverage is required before release
        type: string
        default: all
  workflow_dispatch:
    inputs:
      target:
        description: Select one device for diagnosis, or all for acceptance
        type: choice
        default: all
        options: [all, phone, tv1080, tv4k, compat26]
  schedule:
    - cron: '40 3 * * 1'
permissions:
  contents: read
concurrency:
  # A reusable workflow must never share its caller's concurrency group.
  group: cinematv-device-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate device QA harness without an emulator
        run: |
          bash -n scripts/run-device-qa.sh
          python3 -m unittest discover -s scripts/tests -v
      - id: select
        env:
          QA_TARGET: ${{ inputs.target || 'all' }}
        run: |
          MATRIX=$(python3 scripts/qa-device-matrix.py "$QA_TARGET")
          printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"
  instrumented:
    name: UI / ${{ matrix.name }}
    needs: select-devices
    # Keep the emulator off the moving ubuntu-latest OS release; Ubuntu 26.04
    # images changed between passing and failing 4K runs (cause unconfirmed).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-devices.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore pinned offline Noto fonts
        uses: actions/cache@v4
        with:
          path: app/build/generated/notoAssets/fonts
          # Font bytes are platform-independent; Ubuntu APK and device jobs share this key.
          key: noto-fonts-v1-${{ hashFiles('scripts/fonts/noto-fonts.lock.json') }}
      - name: Install compile SDK and validate original media fixture
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          # Validate committed synthetic bytes offline; no per-device FFmpeg install.
          bash scripts/generate-test-media.sh
          python -m pip install 'Pillow==11.3.0'
      - name: Compile instrumentation before allocating emulator memory
        timeout-minutes: 13
        run: |
          mkdir -p qa
          free -m
          START=$SECONDS
          set +e
          timeout --signal=TERM --kill-after=30s 12m gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
          STATUS=$?
          printf 'assemble\t%s\t%s\n' "$STATUS" "$((SECONDS - START))" > qa/stages.tsv
          free -m
          exit "$STATUS"
      - name: Verify exact Noto font bytes before further gates
        run: python3 scripts/fonts/verify-noto-fonts.py
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: ${{ matrix.api }}
          # TV hosts use AOSP: prior Google-image evidence is a different
          # environment and cannot substitute for this matrix's acceptance.
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          # Android's archived stable build; newer 37.2.13 runners lost the
          # emulator connection during screenshot readback in this suite.
          emulator-build: '15004761'
          disable-animations: false
          # Lavapipe passed the isolated API 33 public phone run (41859160272);
          # this motivates the renderer choice, but full matrix acceptance is pending.
          emulator-options: '-no-window -no-audio -gpu lavapipe -feature -Vulkan -no-snapshot -no-boot-anim -memory 2048'
          script: bash scripts/run-device-qa.sh '${{ matrix.size }}' '${{ matrix.density }}' '${{ matrix.classes }}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ matrix.name }}
          path: |
            qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
