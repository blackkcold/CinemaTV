name: Validate CinemaTV branding
on:
  push:
    branches: [main]
    paths:
      - 'design/branding/**'
      - 'scripts/render-branding.sh'
      - 'scripts/branding/**'
      - 'scripts/tests/test_brand_resources.py'
      - 'app/src/main/res/drawable-nodpi/**'
      - 'app/src/main/res/drawable/cinema_brand*'
      - 'app/src/main/res/drawable/ic_launcher*'
      - 'app/src/main/res/mipmap-anydpi-v26/**'
      - '.github/workflows/brand-assets.yml'
  pull_request:
    paths:
      - 'design/branding/**'
      - 'scripts/render-branding.sh'
      - 'scripts/branding/**'
      - 'scripts/tests/test_brand_resources.py'
      - 'app/src/main/res/drawable-nodpi/**'
      - 'app/src/main/res/drawable/cinema_brand*'
      - 'app/src/main/res/drawable/ic_launcher*'
      - 'app/src/main/res/mipmap-anydpi-v26/**'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed raster bytes and Android brand contracts
        run: python -m unittest discover -s scripts/tests -p 'test_brand_resources.py'
      - name: Ensure validation did not modify tracked assets
        run: git diff --exit-code
