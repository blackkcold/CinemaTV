name: Acceptance / production browser
on:
  workflow_call:
    inputs:
      capture:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    name: Production browser / candidate capture or reviewed comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CINEMA_VISUAL_CAPTURE: ${{ inputs.capture && '1' || '0' }}
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - name: Build real production assets and test-side fonts
        run: |
          npm --prefix frontend/tv-web ci --ignore-scripts
          npm --prefix frontend/tv-web run build
          python3 scripts/acceptance/browser-fonts.py
          python3 scripts/hybrid/artifacts.py web-receipt --output "$RUNNER_TEMP/web-build-receipt.json"
      - name: Current development interaction regressions
        working-directory: frontend/tv-web
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Production-dist visual contracts
        working-directory: frontend/tv-web
        run: npx playwright test --config production.config.ts
      - name: Record scope of visual result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          value = {'sourceCommit': os.environ['EXPECTED_SOURCE_SHA'],
                   'mode': 'candidate-only-not-approved' if os.environ['CINEMA_VISUAL_CAPTURE'] == '1' else 'reviewed-comparison',
                   'productionSigned': False, 'publicationAllowed': False}
          pathlib.Path('frontend/tv-web/visual-scope.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-production-browser
          path: |
            frontend/tv-web/production-captures/
            frontend/tv-web/production-results/
            frontend/tv-web/test-results/
            frontend/tv-web/visual-scope.json
            ${{ runner.temp }}/web-build-receipt.json
          if-no-files-found: error
          retention-days: 30
