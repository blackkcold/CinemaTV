name: Hybrid acceptance
on:
  push:
    branches: [fix/hybrid-acceptance-serial-qa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinematv-acceptance-source-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  source:
    name: Immutable source provenance and harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.mode.outputs.full }}
      visual: ${{ steps.mode.outputs.visual }}
      capture: ${{ steps.mode.outputs.capture }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select bounded acceptance scope
        id: mode
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          message = os.environ.get('COMMIT_MESSAGE', '')
          full = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or any(x in message for x in ('[acceptance-run]', '[acceptance-capture]'))
          capture = any(x in message for x in ('[visual-capture]', '[acceptance-capture]'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in {'full': full, 'visual': full or capture, 'capture': capture}.items():
                  stream.write(f'{key}={str(value).lower()}\n')
          PY
      - name: Record exact source without credentials or build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/acceptance-source/source.tar.gz"
          python3 - "$RUNNER_TEMP/acceptance-source" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          receipt = {'schema': 1, 'sourceSha': git('rev-parse', 'HEAD'),
                     'sourceTree': git('rev-parse', 'HEAD^{tree}'),
                     'baseDevSha': '7d3ec0055cf8cf48edb18b8ea91763114633123a',
                     'workflowRun': os.environ['GITHUB_RUN_ID'],
                     'archiveSha256': hashlib.sha256((root / 'source.tar.gz').read_bytes()).hexdigest(),
                     'scope': 'source-only; not device acceptance or release approval'}
          (root / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Acceptance harness tests and shell syntax
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 -m unittest discover -s scripts/acceptance -v
          for script in scripts/acceptance/*.sh; do bash -n "$script"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-source
          path: ${{ runner.temp }}/acceptance-source/
          if-no-files-found: error
          retention-days: 7
  policy-stage:
    name: Prepare mutex policy blobs / no ref mutation
    needs: source
    if: contains(github.event.head_commit.message, '[policy-stage]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Stage only deterministic policy changes for connector review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/acceptance/stage_workflows.py --output "$RUNNER_TEMP/staged-policy"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-staged-policy
          path: ${{ runner.temp }}/staged-policy/
          if-no-files-found: error
  browser:
    name: Production browser / candidate capture or reviewed comparison
    needs: source
    if: needs.source.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CINEMA_VISUAL_CAPTURE: ${{ needs.source.outputs.capture == 'true' && '1' || '0' }}
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - name: Build real production assets and test-side fonts
        run: |
          npm --prefix frontend/tv-web ci --ignore-scripts
          npm --prefix frontend/tv-web run build
          python3 scripts/acceptance/browser-fonts.py
          python3 scripts/hybrid/artifacts.py web-receipt --output "$RUNNER_TEMP/web-build-receipt.json"
      - name: Current development interaction regressions
        working-directory: frontend/tv-web
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Production-dist visual contracts
        working-directory: frontend/tv-web
        run: npx playwright test --config production.config.ts
      - name: Record scope of visual result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          value = {'sourceCommit': os.environ['EXPECTED_SOURCE_SHA'],
                   'mode': 'candidate-only-not-approved' if os.environ['CINEMA_VISUAL_CAPTURE'] == '1' else 'reviewed-comparison',
                   'productionSigned': False, 'publicationAllowed': False}
          pathlib.Path('frontend/tv-web/visual-scope.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-production-browser
          path: |
            frontend/tv-web/production-captures/
            frontend/tv-web/production-results/
            frontend/tv-web/test-results/
            frontend/tv-web/visual-scope.json
            ${{ runner.temp }}/web-build-receipt.json
          if-no-files-found: error
          retention-days: 30
  build:
    needs: source
    if: needs.source.outputs.full == 'true'
    uses: ./.github/workflows/acceptance-build.yml
  protocol:
    needs: source
    if: needs.source.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Both checksum-pinned official LibreTV contract sets
        run: bash scripts/acceptance/run-upstreams.sh "$RUNNER_TEMP/acceptance-upstreams"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-upstreams
          path: ${{ runner.temp }}/acceptance-upstreams/
          if-no-files-found: error
  tv26:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: tv26
  tv29:
    needs: [build, tv26]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: tv29
  phone35:
    needs: [build, tv29]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: phone35
  native-phone:
    needs: [build, phone35]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: native-phone
  native-compat26:
    needs: [build, native-phone]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: native-compat26
  native1080:
    needs: [build, native-compat26]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: native1080
  hybrid1080:
    needs: [build, native1080]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: hybrid1080
  account26:
    needs: [build, hybrid1080]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: account26
  account33:
    needs: [build, account26]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: account33
  recommendation33:
    needs: [build, account33]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: recommendation33
  updates-phone:
    needs: [build, recommendation33]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: updates-phone
  updates-tv:
    needs: [build, updates-phone]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: updates-tv
  native4k:
    needs: [build, updates-tv]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: native4k
  hybrid4k:
    needs: [build, native4k]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/acceptance-device.yml
    with:
      lane: hybrid4k
  acceptance:
    name: Complete exact-source acceptance / no publication
    needs: [source, browser, build, protocol, tv26, tv29, phone35, native-phone, native-compat26, native1080, hybrid1080, account26, account33, recommendation33, updates-phone, updates-tv, native4k, hybrid4k]
    if: ${{ always() && needs.source.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_NEEDS: ${{ toJSON(needs) }}
      CINEMA_VISUAL_CAPTURE: ${{ needs.source.outputs.capture == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-device-*
          path: ${{ runner.temp }}/acceptance-input/devices
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-build-identities
          path: ${{ runner.temp }}/acceptance-input/builds
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-production-browser
          path: ${{ runner.temp }}/acceptance-input/browser
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-upstreams
          path: ${{ runner.temp }}/acceptance-input/upstreams
      - name: Reject stale, partial, overlapping or unreviewed evidence
        if: always()
        run: python3 scripts/acceptance/collect.py --directory "$RUNNER_TEMP/acceptance-input" --output "$RUNNER_TEMP/acceptance-manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-manifest
          path: ${{ runner.temp }}/acceptance-manifest.json
          if-no-files-found: error
