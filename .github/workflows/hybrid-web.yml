name: Hybrid TV Web
on:
  push:
    branches: [dev]
    paths: ['app/**', 'frontend/tv-web/**', 'scripts/hybrid/**', '.github/workflows/hybrid-web.yml']
  pull_request:
    branches: [dev]
    paths: ['app/**', 'frontend/tv-web/**', 'scripts/hybrid/**', '.github/workflows/hybrid-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hybrid-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    # Playwright 1.56.1's packaged browser dependencies target this supported OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the reviewed PR head, not a moving branch or an implicit merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/tv-web/package-lock.json
      - name: Install locked dependencies and verify production bundle
        working-directory: frontend/tv-web
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run verify
      - name: Record the exact source and production asset bytes
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/hybrid/artifacts.py check-source
          # Playwright clears test-results on startup; retain provenance separately.
          python3 scripts/hybrid/artifacts.py web-receipt --output app/build/hybrid-web/build-receipt.json
      - name: Browser interaction and visual evidence
        working-directory: frontend/tv-web
        run: |
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-browser-evidence
          path: |
            frontend/tv-web/test-results/
            frontend/tv-web/playwright-report/
            frontend/tv-web/dist/
            app/build/hybrid-web/build-receipt.json
          if-no-files-found: error
