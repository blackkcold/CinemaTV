<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">CinemaTV A1 / Custom wordmark and subtle lens dispersion / banner</title><desc>Review refinement of selected A1. Custom vector-drawn lettering, rounded play symbol, very subtle cool and warm lens fringes over horizontal motion blur. No external fonts or raster images.</desc><defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030407"/><stop offset=".52" stop-color="#07090d"/><stop offset="1" stop-color="#020305"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8196ae" stop-opacity="0"/><stop offset=".30" stop-color="#a4b0c0" stop-opacity=".16"/><stop offset=".65" stop-color="#d7e2ef" stop-opacity=".9"/><stop offset=".88" stop-color="#a8bbd4" stop-opacity=".30"/><stop offset="1" stop-color="#8196ae" stop-opacity="0"/></linearGradient>
 <linearGradient id="center-dim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#020306" stop-opacity="0"/><stop offset=".40" stop-color="#020306" stop-opacity=".68"/><stop offset=".60" stop-color="#020306" stop-opacity=".68"/><stop offset="1" stop-color="#020306" stop-opacity="0"/></linearGradient>
 <filter id="broad" x="-40%" y="-300%" width="180%" height="700%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="85 16"/></filter>
 <filter id="soft" x="-40%" y="-300%" width="180%" height="700%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="52 5.5"/></filter>
 <filter id="filament" x="-40%" y="-300%" width="180%" height="700%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="23 1.3"/></filter>
 <linearGradient id="lens-blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9bb8ed" stop-opacity="0"/><stop offset=".54" stop-color="#9bb8ed" stop-opacity=".7"/><stop offset=".80" stop-color="#b0c9e5" stop-opacity=".36"/><stop offset="1" stop-color="#9bb8ed" stop-opacity="0"/></linearGradient><linearGradient id="lens-warm" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dec2bc" stop-opacity="0"/><stop offset=".54" stop-color="#dec2bc" stop-opacity=".65"/><stop offset=".80" stop-color="#d9bcae" stop-opacity=".32"/><stop offset="1" stop-color="#dec2bc" stop-opacity="0"/></linearGradient><filter id="lens-soft" x="-40%" y="-500%" width="180%" height="1100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="38 2.7"/></filter><filter id="lens-glint" x="-40%" y="-500%" width="180%" height="1100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18 1.7"/></filter></defs><rect id="black-base" width="1920" height="1080" fill="url(#base)"/><g id="slow-scale" transform="scale(1.0 1.0)"><g id="slow-trails" class="slow"><rect x="-590" y="349" width="1440" height="44" fill="url(#beam)" opacity="0.34" filter="url(#broad)"/><rect x="690" y="734" width="1810" height="36" fill="url(#beam)" opacity="0.32" filter="url(#broad)"/><rect x="-530" y="689" width="1290" height="33" fill="url(#beam)" opacity="0.15" filter="url(#broad)"/><rect x="1010" y="284" width="1360" height="31" fill="url(#beam)" opacity="0.16" filter="url(#broad)"/><rect x="-180" y="832" width="1030" height="18" fill="url(#beam)" opacity="0.1" filter="url(#broad)"/></g></g><g id="medium-scale" transform="scale(1.0 1.0)"><g id="medium-trails" class="medium"><g id="subtle-lens-dispersion">
 <rect x="-510" y="361" width="1460" height="4" fill="url(#lens-warm)" opacity=".43" filter="url(#lens-soft)"/>
 <rect x="-510" y="380" width="1460" height="4" fill="url(#lens-blue)" opacity=".48" filter="url(#lens-soft)"/>
 <rect x="835" y="675" width="1580" height="4" fill="url(#lens-blue)" opacity=".46" filter="url(#lens-soft)"/>
 <rect x="835" y="695" width="1580" height="4" fill="url(#lens-warm)" opacity=".39" filter="url(#lens-soft)"/>
 <rect x="80" y="365" width="470" height="2" fill="url(#lens-warm)" opacity=".34" filter="url(#lens-glint)"/>
 <rect x="95" y="376" width="465" height="2" fill="url(#lens-blue)" opacity=".38" filter="url(#lens-glint)"/>
 <rect x="1460" y="680" width="470" height="2" fill="url(#lens-blue)" opacity=".33" filter="url(#lens-glint)"/>
 <rect x="1450" y="692" width="470" height="2" fill="url(#lens-warm)" opacity=".30" filter="url(#lens-glint)"/>
 </g><rect x="-540" y="370" width="1490" height="9" fill="url(#beam)" opacity="0.56" filter="url(#soft)"/><rect x="-670" y="399" width="1390" height="6" fill="url(#beam)" opacity="0.28" filter="url(#soft)"/><rect x="810" y="683" width="1600" height="12" fill="url(#beam)" opacity="0.54" filter="url(#soft)"/><rect x="1080" y="711" width="1340" height="7" fill="url(#beam)" opacity="0.34" filter="url(#soft)"/><rect x="-830" y="650" width="1350" height="9" fill="url(#beam)" opacity="0.22" filter="url(#soft)"/><rect x="1350" y="464" width="1200" height="6" fill="url(#beam)" opacity="0.2" filter="url(#soft)"/></g></g><g id="fast-scale" transform="scale(1.0 1.0)"><g id="fast-trails" class="fast"><rect x="-510" y="355" width="1290" height="2" fill="url(#beam)" opacity="0.48" filter="url(#filament)"/><rect x="-680" y="385" width="1330" height="2" fill="url(#beam)" opacity="0.27" filter="url(#filament)"/><rect x="-230" y="416" width="960" height="1.5" fill="url(#beam)" opacity="0.19" filter="url(#filament)"/><rect x="990" y="670" width="1430" height="2" fill="url(#beam)" opacity="0.51" filter="url(#filament)"/><rect x="930" y="699" width="1210" height="1.6" fill="url(#beam)" opacity="0.28" filter="url(#filament)"/><rect x="1250" y="735" width="1120" height="1.8" fill="url(#beam)" opacity="0.21" filter="url(#filament)"/><rect x="-580" y="630" width="1040" height="1.5" fill="url(#beam)" opacity="0.17" filter="url(#filament)"/><rect x="1570" y="456" width="620" height="1.4" fill="url(#beam)" opacity="0.19" filter="url(#filament)"/></g></g><rect id="logo-clear-space" width="1920" height="1080" fill="url(#center-dim)"/><g id="centered-logo"><g transform="translate(559.5459523809524 448.0) scale(1.0952380952380953) translate(-54 -44)"><g id="player-symbol" fill="none" stroke="#f5f5f3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M 65 146 V 64 Q 65 49 78 56 L 197 121 Q 210 128 197 135 L 78 200 Q 65 207 65 192 V 183"/></g></g><g id="wordmark-custom-outline